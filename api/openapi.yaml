openapi: 3.0.0
info:
  title: File Sharing API
  description: API cho dịch vụ chia sẻ file.
  version: 1.0.0-rc.1

paths:
  /api/me:
    get:
      summary: Lấy thông tin người dùng hiện tại
      description: |
        Trả về thông tin của người dùng đang thực hiện request.
        Middleware sẽ tự động tạo người dùng mới nếu chưa tồn tại dựa trên header.
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/TelegramUserId"
        - $ref: "#/components/parameters/TelegramUsername"
      responses:
        "200":
          description: Thành công. Trả về thông tin người dùng.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad Request - Header bị thiếu hoặc không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files:
    post:
      summary: Khởi tạo upload, trả URL hoặc nhận file
      description: |
        Cho phép người dùng khởi tạo upload file.  
        Backend sẽ:
        - Xác thực người dùng dựa trên Telegram headers.  
        - Tạo bản ghi `files` trong DB (trạng thái `pending`).  
        - Tạo URL upload (presigned URL) hoặc chấp nhận file trực tiếp.  
        - Trả về `file_id`, `object_key`, và `upload_url` (nếu có).
      tags:
        - Files
      parameters:
        - $ref: "#/components/parameters/TelegramUserId"
        - $ref: "#/components/parameters/TelegramUsername"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - size
              properties:
                filename:
                  type: string
                  example: "photo.jpg"
                size:
                  type: integer
                  example: 204800
                mime_type:
                  type: string
                  example: "image/jpeg"
                created_at:
                  type: string
                  formant: date-time
                  example: "2025-11-09T14:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  example: "2025-11-09T14:00:00Z"
      responses:
        "200":
          description: Thành công – trả về thông tin upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInitResponse"
        "400":
          description: Thiếu hoặc sai dữ liệu đầu vào
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    TelegramUserId:
      name: X-Telegram-User-Id
      in: header
      required: true
      description: ID người dùng từ Telegram.
      schema:
        type: integer
        format: int64
    TelegramUsername:
      name: X-Telegram-Username
      in: header
      required: true
      description: Username người dùng từ Telegram.
      schema:
        type: string
  schemas:
    FileInitResponse:
      type: object
      properties:
        file_id:
          type: integer
          example: 101
        object_key:
          type: string
          example: "uploads/2025/11/09/photo_abc123.jpg"
        upload_url:
          type: string
          example: "https://minio.example.com/presigned/abc123"
        status:
          type: string
          example: "pending"
        created_at:
          type: string
          format: date-time
          example: "2025-11-09T14:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-09T14:00:00Z"
    User:
      type: object
      properties:
        id:
          type: integer
          description: ID nội bộ của user.
        telegram_id:
          type: integer
          format: int64
          description: ID từ Telegram.
        username:
          type: string
          description: Username từ Telegram.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
